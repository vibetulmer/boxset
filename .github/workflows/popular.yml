# Rebuilds data/popular.json (the Entdecken deck) once a week from TVmaze, so new shows that
# have become popular join the list. Commits only when the list actually changed; GitHub Pages
# then publishes it. Run it by hand under Actions → "Entdecken-Liste aktualisieren" → Run workflow.
name: Entdecken-Liste aktualisieren

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: popular
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build list from TVmaze
        run: node scripts/build-popular.mjs 3000

      - name: Commit if changed
        id: commit
        run: |
          # The build script leaves the file untouched when the list is the same.
          if git diff --quiet -- data/popular.json; then
            echo "Keine Änderung an der Liste."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/popular.json
          git commit -m "Entdecken-Liste aktualisiert ($(date -u +%Y-%m-%d))"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token do not always start a Pages build; ask for one.
      - name: Publish on GitHub Pages
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages-Build wird vermutlich schon über den Push gestartet."

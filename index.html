<!--
THESIS: A lifetime of watched TV as a box-set shelf, drawn flat and graphic. Refuses the streaming-clone poster grid on black with a red accent: every season is a spine, unwatched seasons are empty outlined cases, the gaps are the data.
OWN-WORLD: Blu-ray cobalt drenches the surface (sunk header, flat two-tone boards), flat spines coloured from each show's poster, outlined empty cases, yellow reserved for "watched", white stickers for ratings and tiers, face-out covers in a Blu-ray case frame. Sofia Sans Extra Condensed for spines, figures and headings; Sofia Sans for reading. No faked bevels, grain or sheen.
STORY: The owner searches a show, puts it on the shelf in one tap, refines by season or episode, sets rewatches, rates it. The shelf grows; the totals tell them how much of their life went into it.
FIRST VIEWPORT: Lifetime sentence and spec strip on top, full-width shelf of box sets below; nav as divider tabs (top on desktop, bottom on phone), search always one tap away.
FORM: candidate 3 of 7 (DVD box-set shelf), seed key 4247fb57.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
